{% extends 'emails/base_email.html' %}

{% block email_title %}{{ title }} &mdash; Smart HRMS{% endblock %}
{% block preheader %}{{ title }}{% endblock %}

{% block header_badge %}
<span style="background-color: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase;">
    Announcement
</span>
{% endblock %}

{% block content %}
<div style="margin-bottom: 24px;">
    <h1 style="font-size: 22px; font-weight: 700; color: #0f172a; margin: 0 0 12px 0; letter-spacing: -0.3px;">
        {{ title }}
    </h1>
    <div style="font-size: 15px; color: #334155; line-height: 1.7;">
        {{ message|linebreaks }}
    </div>
</div>

<div style="text-align: center; margin: 30px 0 20px 0;">
    <a href="{{ site_url }}" style="background-color: #4f46e5; color: #ffffff; text-decoration: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-block;">
        Open HR Portal &rarr;
    </a>
</div>
{% endblock %}
